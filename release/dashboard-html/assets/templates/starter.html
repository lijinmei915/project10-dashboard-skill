<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <style>
    :root {
      color-scheme: light;

      --page-bg: #f5f7fa;
      --surface: #ffffff;
      --surface-muted: #f8fafc;
      --text-main: #111827;
      --text-secondary: #6b7280;
      --text-muted: #9ca3af;
      --line-soft: rgba(15, 23, 42, 0.06);
      --shadow-card: 0 2px 10px rgba(15, 23, 42, 0.04);

      --accent: #ff7a2f;
      --accent-soft: rgba(255, 122, 47, 0.12);
      --success: #16a34a;
      --success-soft: rgba(22, 163, 74, 0.12);
      --warning: #d97706;
      --warning-soft: rgba(217, 119, 6, 0.12);
      --danger: #dc2626;
      --danger-soft: rgba(220, 38, 38, 0.12);

      --radius-card: 14px;
      --radius-block: 12px;
      --radius-pill: 999px;

      --space-page-x: 24px;
      --space-page-y: 24px;
      --space-section: 28px;
      --space-card: 20px;
      --space-gap: 16px;

      --page-max-width: 1160px;
      --split-main: 2fr;
      --split-side: 1fr;
      --canvas-min-height: 280px;
    }

    html[data-theme="dark"] {
      color-scheme: dark;

      --page-bg: #111827;
      --surface: #1f2937;
      --surface-muted: #172033;
      --text-main: #f9fafb;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --line-soft: rgba(226, 232, 240, 0.12);
      --shadow-card: 0 2px 10px rgba(0, 0, 0, 0.22);

      --accent: #fb923c;
      --accent-soft: rgba(251, 146, 60, 0.16);
      --success: #86efac;
      --success-soft: rgba(34, 197, 94, 0.18);
      --warning: #fcd34d;
      --warning-soft: rgba(245, 158, 11, 0.18);
      --danger: #fca5a5;
      --danger-soft: rgba(239, 68, 68, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      background: var(--page-bg);
      color: var(--text-main);
      font-family: "Segoe UI", "PingFang SC", Roboto, "Microsoft YaHei", sans-serif;
      line-height: 1.6;
    }

    .page {
      width: min(100%, var(--page-max-width));
      margin: 0 auto;
      padding: var(--space-page-y) var(--space-page-x) 40px;
    }

    .page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--space-gap);
      margin-bottom: var(--space-section);
    }

    .page-heading {
      min-width: 0;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      padding: 6px 14px;
      border-radius: var(--radius-pill);
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0;
    }

    .page-title {
      margin: 18px 0 0;
      font-size: 32px;
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: 0;
    }

    .page-subtitle {
      margin: 14px 0 0;
      color: var(--text-secondary);
      font-size: 15px;
      line-height: 1.7;
    }

    .dashboard-root,
    .section,
    .stack {
      display: grid;
    }

    .dashboard-root,
    .section {
      gap: var(--space-section);
    }

    .stack {
      gap: var(--space-gap);
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .section-title,
    .surface-title {
      margin: 0;
      font-weight: 600;
      line-height: 1.3;
      letter-spacing: 0;
    }

    .section-title {
      font-size: 18px;
    }

    .surface-title {
      font-size: 16px;
    }

    .section-note,
    .surface-meta {
      margin: 0;
      color: var(--text-secondary);
      font-size: 13px;
    }

    .surface,
    .card {
      min-width: 0;
      padding: var(--space-card);
      background: var(--surface);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
    }

    .surface-muted,
    .card-muted {
      background: var(--surface-muted);
    }

    .grid,
    .split {
      display: grid;
      gap: var(--space-gap);
      min-width: 0;
    }

    .grid-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .grid-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .grid-4 {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .grid-auto {
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr));
    }

    .split {
      grid-template-columns: minmax(0, var(--split-main)) minmax(240px, var(--split-side));
    }

    .canvas {
      min-width: 0;
      min-height: var(--canvas-min-height);
    }

    .content-area {
      min-width: 0;
    }

    .table-area {
      min-width: 0;
      overflow-x: auto;
    }

    .table-area table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .table-area th,
    .table-area td {
      padding: 12px 10px;
      border-bottom: 1px solid var(--line-soft);
      text-align: left;
      white-space: nowrap;
    }

    .table-area th {
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 600;
    }

    @media (max-width: 900px) {
      .grid-3,
      .grid-4 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .split {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 640px) {
      .page {
        padding: 20px 16px 32px;
      }

      .page-header,
      .section-header {
        flex-direction: column;
        align-items: flex-start;
      }

      .grid-2,
      .grid-3,
      .grid-4 {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="page-header">
      <div class="page-heading">
        <!-- Generate the page eyebrow, title, and context for this request. -->
      </div>
      <!-- Add only user-requested header actions. -->
    </header>

    <div id="dashboard-root" class="dashboard-root">
      <!-- Compose request-specific content with surface, grid, split, stack, canvas, and table-area. -->
    </div>
  </main>
</body>
</html>
