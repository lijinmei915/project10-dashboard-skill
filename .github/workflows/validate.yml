name: Validate Dashboard Platform

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dashboard
          POSTGRES_PASSWORD: dashboard-test
          POSTGRES_DB: dashboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dashboard -d dashboard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DASHBOARD_TEST_POSTGRES_URL: postgresql://dashboard:dashboard-test@127.0.0.1:5432/dashboard_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run build:skill
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
