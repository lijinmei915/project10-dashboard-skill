<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>图表筛选与图例演示</title>
  <style>
    :root{--text:#18181b;--muted:#71717a;--line:#e4e4e7;--surface:#fff;--page:#f4f4f5;--blue:#5b8ff9;--green:#43c59e}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--text);font:14px/1.5 "PingFang SC","Microsoft YaHei",sans-serif}.page{max-width:980px;margin:0 auto;padding:42px 24px}.card{padding:20px;border:1px solid var(--line);border-radius:8px;background:var(--surface);box-shadow:0 2px 8px rgb(24 24 27/.06)}header{display:flex;align-items:center;justify-content:space-between;gap:16px}h1{margin:0;font-size:16px}.custom-select{position:relative;width:148px}.custom-select-trigger{display:flex;align-items:center;justify-content:space-between;width:100%;height:34px;padding:0 8px 0 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--text);font:inherit;text-align:left}.custom-select-trigger:hover{border-color:#d4d4d8;background:#fafafa}.custom-select-trigger:focus-visible{outline:0;border-color:var(--text);box-shadow:0 0 0 2px rgb(24 24 27/.12)}.chevron{width:14px;height:14px;fill:none;stroke:var(--muted);stroke-width:2;transition:transform .15s}.custom-select[data-open=true] .chevron{transform:rotate(180deg)}.listbox{position:absolute;z-index:10;top:38px;left:0;width:100%;padding:4px;border:1px solid var(--line);border-radius:6px;background:#fff;box-shadow:0 8px 20px rgb(24 24 27/.13)}.custom-select[data-open=false] .listbox{display:none}.option{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:32px;padding:6px 8px;border:0;border-radius:4px;background:transparent;color:var(--text);font:inherit;text-align:left}.option:hover,.option[aria-selected=true]{background:#f4f4f5}.option[aria-selected=true]{font-weight:650}.check{width:14px;height:14px;visibility:hidden;fill:none;stroke:var(--text);stroke-width:2.25}.option[aria-selected=true] .check{visibility:visible}.legend{display:flex;gap:16px;margin:18px 0 4px}.legend button{display:flex;align-items:center;gap:7px;padding:3px 0;border:0;background:none;color:var(--muted);font:inherit;cursor:pointer}.legend button[aria-pressed=false]{opacity:.4;text-decoration:line-through}.dot{width:8px;height:8px;border-radius:50%;background:var(--color)}svg.chart{display:block;width:100%;height:auto;margin-top:4px}.grid{stroke:#e4e4e7}.axis{fill:var(--muted);font-size:12px}@media(max-width:600px){.page{padding:18px 12px}header{align-items:flex-start}h1{font-size:15px}.legend{overflow:auto;white-space:nowrap}}
  </style>
</head>
<body>
  <main class="page"><article class="card"><header><h1 id="title">商机数量趋势</h1><div class="custom-select" data-open="false"><button class="custom-select-trigger" type="button" role="combobox" aria-label="指标" aria-expanded="false"><span>商机数量</span><svg class="chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button><div class="listbox" role="listbox"><button class="option" type="button" role="option" data-value="商机数量" aria-selected="true"><span>商机数量</span><svg class="check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg></button><button class="option" type="button" role="option" data-value="商机金额" aria-selected="false"><span>商机金额</span><svg class="check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg></button><button class="option" type="button" role="option" data-value="预计收入" aria-selected="false"><span>预计收入</span><svg class="check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg></button></div></div></header><div class="legend" aria-label="图例"><button type="button" data-series="current" aria-pressed="true" style="--color:var(--blue)"><span class="dot"></span>本期</button><button type="button" data-series="previous" aria-pressed="true" style="--color:var(--green)"><span class="dot"></span>上期</button></div><svg class="chart" viewBox="0 0 760 300" role="img" aria-label="商机趋势双系列图"><g class="grid"><line x1="46" y1="238" x2="728" y2="238"/><line x1="46" y1="170" x2="728" y2="170"/><line x1="46" y1="102" x2="728" y2="102"/></g><polyline data-line="current" points="52,212 180,158 308,180 436,106 564,128 716,58" fill="none" stroke="var(--blue)" stroke-width="4"/><polyline data-line="previous" points="52,230 180,196 308,142 436,164 564,92 716,118" fill="none" stroke="var(--green)" stroke-width="4"/><g class="axis"><text x="48" y="276">1月</text><text x="176" y="276">2月</text><text x="304" y="276">3月</text><text x="432" y="276">4月</text><text x="560" y="276">5月</text><text x="704" y="276">6月</text></g></svg></article></main>
  <script>
    const root=document.querySelector('.custom-select'),trigger=root.querySelector('.custom-select-trigger'),value=trigger.querySelector('span');trigger.onclick=()=>{const open=root.dataset.open!=='true';root.dataset.open=String(open);trigger.setAttribute('aria-expanded',String(open))};document.querySelectorAll('.option').forEach(o=>o.onclick=()=>{document.querySelectorAll('.option').forEach(x=>x.setAttribute('aria-selected',String(x===o)));value.textContent=o.dataset.value;document.querySelector('#title').textContent=o.dataset.value+'趋势';root.dataset.open='false';trigger.setAttribute('aria-expanded','false')});document.addEventListener('pointerdown',e=>{if(!root.contains(e.target)){root.dataset.open='false';trigger.setAttribute('aria-expanded','false')}});document.querySelectorAll('.legend button').forEach(b=>b.onclick=()=>{const next=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',String(next));document.querySelector('[data-line="'+b.dataset.series+'"]').style.display=next?'':'none'});
  </script>
</body>
</html>
